<title>Papi's Hot Chicken — Digital Menu Board</title>
<style>
:root { --accent:#f53225; --bright:#ff9f35; --cream:#fff5e3; --ink:#090606; --line:rgba(255,106,65,.34); }
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;background:#080607;color:var(--cream);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit} button{cursor:pointer} button:disabled{opacity:.35;cursor:not-allowed}
#app{position:fixed;inset:0;display:flex;background:#050303} #display{position:relative;flex:1;overflow:hidden;background:#090607;min-width:0}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);transform-origin:center center;overflow:hidden;isolation:isolate;background:

.fire-glow{position:absolute;left:-12%;right:-12%;top:90px;height:115px;transform:rotate(-2deg);background:linear-gradient(90deg,transparent,rgba(239,37,22,.18) 25%,rgba(255,105,44,.23) 50%,rgba(239,37,22,.18) 75%,transparent);filter:blur(37px);animation:breath 6s ease-in-out infinite alternate;pointer-events:none}
.top-edge{position:absolute;left:0;top:0;width:100%;height:8px;background:linear-gradient(90deg,transparent 0%,#b51613 22%,#fa4e30 50%,#b51613 78%,transparent 100%);box-shadow:0 2px 26px rgba(248,42,21,.5)}
.board-header{height:184px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding:11px 64px 0}
.brand-block{position:relative;display:flex;align-items:center;justify-content:center;gap:27px;filter:drop-shadow(0 11px 7px rgba(0,0,0,.6))}
.mascot{width:148px;height:146px;flex-shrink:0;transform:rotate(-7deg);filter:drop-shadow(0 0 15px rgba(253,52,22,.25))}
.brand-words{display:flex;flex-direction:column;align-items:flex-start;margin-top:-6px;line-height:.88}
.main-brand{font-family:Impact,'Arial Black',sans-serif;letter-spacing:-2px;font-size:112px;font-weight:900;font-style:italic;text-transform:uppercase;white-space:nowrap;color:#fff2dc;text-shadow:4px 5px 0 #34100e,0 0 37px #ed3d231c;transform:skewX(-6deg)}
.sub-brand{margin-top:12px;display:flex;align-items:center;gap:16px;align-self:flex-end;text-align:right}
.sub-brand span{font-family:Impact,'Arial Narrow',sans-serif;font-style:italic;font-weight:900;letter-spacing:9px;font-size:47px;color:var(--accent);text-shadow:3px 3px 0 #230707}
.sub-brand:before{content:"";display:block;width:115px;height:6px;background:linear-gradient(90deg,transparent,var(--accent));transform:skew(-15deg);box-shadow:0 0 20px rgba(248,45,23,.6)}
.flame-icon{display:inline-block;color:#ffb148;font-size:40px;transform:rotate(-13deg);animation:flame 3s ease-in-out infinite}
.header-line{position:absolute;bottom:3px;height:3px;left:32px;right:32px;background:linear-gradient(90deg,transparent,var(--accent) 30%,#ffbb58 50%,var(--accent) 70%,transparent);filter:drop-shadow(0 0 11px var(--accent))}
.side-hatch{position:absolute;top:47px;width:260px;height:75px;opacity:.23;background:repeating-linear-gradient(120deg,transparent 0px,transparent 34px,var(--accent) 34px,var(--accent) 57px,transparent 57px,transparent 79px);mask-image:linear-gradient(90deg,transparent,black)}
.side-hatch.left{left:15px;transform:skewX(-11deg) scaleX(-1)}.side-hatch.right{right:15px;transform:skewX(-11deg)}
.menu-grid{position:absolute;top:202px;left:26px;right:26px;bottom:79px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:17px;z-index:3}
.dish-card{--ix:0;position:relative;min-width:0;border:2px solid rgba(255,77,51,.66);border-radius:18px;background:radial-gradient(circle at 44% 74%,rgba(79,20,12,.48),transparent 66%),linear-gradient(156deg,#21100f,#130c0a 56%,#1a0b08);box-shadow:inset 0 0 0 3px rgba(0,0,0,.4),inset 0 0 28px rgba(185,33,13,.11),0 0 13px rgba(248,41,24,.11);overflow:hidden;transition:border-color .45s,box-shadow .45s;}
.dish-card:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.05) 43%,transparent 65%);transform:translateX(-150%);animation:sheen 12s ease-in-out infinite;animation-delay:calc(var(--ix) * -.55s)}
.dish-card.spotlit{border-color:rgba(255,166,71,.95);box-shadow:inset 0 0 0 2px rgba(0,0,0,.4),0 0 28px rgba(249,56,31,.42),0 0 7px rgba(255,211,139,.25)}
.card-head{position:absolute;top:13px;left:18px;right:17px;z-index:5;display:flex;gap:12px;align-items:center;min-height:53px}
.card-number{flex:0 0 auto;font-family:Impact,'Arial Black',sans-serif;color:var(--accent);font-style:italic;font-size:49px;text-shadow:2px 4px 1px #000;line-height:1}
.card-title{font-family:Impact,'Arial Black',Arial,sans-serif;color:#fff4dd;font-size:39px;font-style:italic;letter-spacing:.3px;text-transform:uppercase;line-height:1.02;max-width:345px;text-shadow:2px 3px 0 #000;}
.card-title.long{font-size:32px}.card-title.verylong{font-size:28px}
.card-description{position:absolute;top:77px;left:20px;right:20px;color:#f0e0cb;font-size:22px;font-weight:600;line-height:1.22;letter-spacing:.1px;z-index:5;min-height:54px;text-shadow:0 2px 3px #000}
.food-window{position:absolute;inset:126px 6px 2px 6px;z-index:1;display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.food-window:before{content:"";position:absolute;bottom:2px;left:10%;right:10%;height:87px;background:radial-gradient(ellipse,rgba(255,108,21,.29),transparent 67%);filter:blur(13px)}
.food-image{position:relative;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 18px 9px rgba(0,0,0,.72)) saturate(1.08) contrast(1.04);animation:floatfood 7.6s ease-in-out infinite;animation-delay:calc(var(--ix) * -.7s)}
.food-window.no-photo .fallback{display:flex}.fallback{display:none;position:relative;align-items:center;justify-content:center;height:100%;width:100%;font-size:120px;opacity:.55}
.price-sticker{position:absolute;right:16px;bottom:14px;min-width:146px;padding:11px 14px 9px;z-index:7;transform:rotate(-3deg);text-align:center;background:#f7cf83;color:#200a05;clip-path:polygon(2% 8%,14% 3%,29% 7%,45% 2%,66% 6%,85% 3%,99% 10%,96% 89%,85% 96%,62% 92%,42% 98%,25% 93%,4% 99%,0 82%);box-shadow:0 2px 18px rgba(0,0,0,.4)}
.price-sticker span{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:47px;letter-spacing:0px;line-height:1;color:#170b06;display:block;transform:skewX(-3deg)}
.price-sticker small{display:block;font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.dish-tag{position:absolute;top:140px;right:10px;z-index:8;background:#ec2b1c;transform:rotate(4deg);color:white;padding:6px 12px;font-size:18px;font-weight:900;text-transform:uppercase;box-shadow:0 4px 8px #0008}
.board-footer{position:absolute;bottom:0;left:0;right:0;height:67px;background:linear-gradient(180deg,rgba(12,6,5,.75),rgba(5,2,2,.96));border-top:2px solid #9b1f16;box-shadow:0 -3px 22px rgba(221,29,11,.17);display:flex;align-items:center;z-index:4;overflow:hidden}
.footer-mark{height:100%;display:flex;align-items:center;gap:10px;padding:0 29px;border-right:1px solid #7b241e;flex-shrink:0;background:#200c09;color:#ffe4bb;font-family:Impact,Arial,sans-serif;font-size:25px;letter-spacing:1.8px}
.footer-mark b{font-size:32px;color:var(--accent)}
.ticker-mask{overflow:hidden;flex:1;position:relative;white-space:nowrap}
.ticker-track{display:inline-flex;gap:130px;min-width:max-content;align-items:center;animation:marquee 35s linear infinite;padding-left:30px}
.ticker-copy{font-weight:900;letter-spacing:4px;font-size:24px;color:#fff0dd}
.ticker-copy:before{content:'✦';color:var(--accent);margin-right:80px}
.footer-checks{width:125px;height:100%;flex-shrink:0;background:conic-gradient(#e12a19 25%,#0f0705 0 50%,#e12a19 0 75%,#0f0705 0) 0 0/34px 34px;transform:skewX(-11deg);opacity:.85}
#quick-tools{position:fixed;top:15px;right:17px;display:flex;gap:8px;z-index:35;opacity:0;transition:opacity .2s} #display:hover #quick-tools,#quick-tools:focus-within{opacity:1}
.qtool{background:#170d0add;border:1px solid #ff604b85;color:#fff1df;border-radius:8px;padding:10px 12px;font-weight:700;font-size:13px;box-shadow:0 8px 22px #0008}
@keyframes floatfood{0%,100%{transform:translateY(7px) scale(.99)}50%{transform:translateY(-7px) scale(1.015)}}
@keyframes breath{0%{opacity:.35}100%{opacity:.9}} @keyframes sheen{0%,78%{transform:translateX(-150%)}90%,100%{transform:translateX(150%)}}
@keyframes flame{0%,100%{transform:rotate(-13deg) scale(1)}50%{transform:rotate(5deg) scale(1.11)}}
@keyframes marquee{to{transform:translateX(-50%)}}
#stage.low-motion .food-image{animation-duration:16s} #stage.low-motion .dish-card:before{animation-duration:23s} #stage.low-motion .ticker-track{animation-duration:65s}

#stage.no-motion .ticker-track{transform:none}
@media(prefers-reduced-motion:reduce){#stage:not(.force-motion) *,#stage:not(.force-motion) *:before,#stage:not(.force-motion) *:after{animation-duration:0.001s!important;transition:none!important}}

.editor-top{padding:22px 22px 15px;border-bottom:1px solid #3b2925;background:#211712}
.editor-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:21px}
.tab{border:1px solid #49312a;color:#c0aaa0;padding:11px 4px;background:#1b1210;border-radius:8px;font-size:13px;font-weight:800}
.tab.selected{background:#f3412b;color:#fff;border-color:#f3412b;box-shadow:0 0 13px #f3412b44}
#editor-content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 22px 26px;scrollbar-width:thin;scrollbar-color:#6c3730 #1b1311}
.section-label{font-size:12px;color:#ff9879;text-transform:uppercase;letter-spacing:2px;font-weight:900;margin:5px 0 12px}
.edit-item-row{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:7px;padding:10px 10px;border:1px solid #42302b;border-radius:9px;background:#211814;color:#f9e6d6;text-align:left;cursor:pointer}
.edit-item-row.active{border-color:#f24e35;background:#39211a;box-shadow:inset 3px 0 #ff6242}
.edit-item-thumb{height:49px;width:58px;object-fit:contain;background:#150d0b;border-radius:5px}
.edit-item-text{flex:1;min-width:0}.edit-item-text strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.edit-item-text small{display:block;color:#bd9e91;margin-top:4px;font-size:12px}
.pill{font-size:11px;color:#aaa;background:#3b2521;padding:4px 8px;border-radius:100px;white-space:nowrap}
.field{display:block;margin:14px 0}.field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:900;color:#cfb5a7;margin-bottom:7px}
.field input,.field textarea,.field select{background:#0f0c0b;color:#fff7ec;border:1px solid #5a3b33;border-radius:8px;outline:none;padding:11px 12px;width:100%;font-size:15px;transition:border-color .2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#ff6742;box-shadow:0 0 0 3px #ff5b3c22}
.field textarea{resize:vertical;min-height:75px;line-height:1.4}
.field small{color:#a98b7f;display:block;margin-top:5px;line-height:1.35}
.fieldline{display:flex;gap:11px;align-items:flex-start}.fieldline>*{flex:1;min-width:0}
.edit-separator{height:1px;background:#392a25;margin:19px 0}
.editor-actions{display:flex;gap:8px;flex-wrap:wrap}.act{border:1px solid #694035;border-radius:8px;background:#3a241e;color:#fbe5d8;padding:10px 14px;font-size:14px;font-weight:900}
.act.primary{background:#ef4329;border-color:#ef4329;color:white}.act.green{background:#27624a;border-color:#4d9473}.act.danger{background:#43201d;border-color:#7b3731;color:#ffae9c}
.act.full{width:100%;display:block}.act:hover{filter:brightness(1.14)}
.upload-box{padding:15px;text-align:center;background:#110d0c;border:1px dashed #855044;border-radius:10px}
.upload-box img{display:block;max-width:100%;width:auto;height:145px;margin:0 auto 8px;object-fit:contain}
.upload-box input{width:100%;font-size:13px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:14px 0;background:#211915;border:1px solid #45332d;padding:14px;border-radius:9px}
.toggle-row strong{font-size:14px}.toggle-row small{display:block;color:#a98c80;font-size:12px;margin-top:5px;line-height:1.3}
.toggle-row input{accent-color:#ef5032;width:21px;height:21px}
.editor-bottom{border-top:1px solid #44302a;background:#201712;padding:12px 20px;display:flex;gap:9px;align-items:center}
.editor-bottom .act{flex:1}.save-status{color:#ae948a;font-size:12px;flex:1}
.note{border-left:3px solid #eb6344;background:#281a17;color:#e7c9b7;padding:14px 15px;line-height:1.5;font-size:13px;border-radius:0 7px 7px 0;margin:15px 0}
#toast{position:fixed;bottom:20px;right:22px;z-index:90;min-width:250px;max-width:400px;background:#251712;border:1px solid #c85b3b;color:#fff5e6;padding:15px 18px;border-radius:10px;box-shadow:0 10px 34px #000b;font-weight:700;display:none}
#toast.show{display:block} #fileImport{display:none}
@media(max-width:800px){#editor{width:100vw;flex:0 0 100vw}#app.editing #display{display:none}}
</style>

<script>
(function(){'use strict';
 const STORAGE_KEY = 'papis-hot-chicken-menu-studio-v1';
 const STARTUP_CONFIG = JSON.parse(document.getElementById('startupData').textContent);
 const clone = o => JSON.parse(JSON.stringify(o));
 const app = document.getElementById('app');
 const stage = document.getElementById('stage');
 const editorContent = document.getElementById('editor-content');
 let current = clone(STARTUP_CONFIG), activeTab='items', selectedId=null, spotTimer=null, spotIndex=-1, toastTimer=null;
 let tempSaveSucceeded=true;
 const $ = id => document.getElementById(id);
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function price(v){const n=Number(String(v||'').replace(/[^\d.]/g,''));return '$'+(Number.isFinite(n)?n:0).toFixed(2)}
 function safeColor(v){return /^#[0-9a-fA-F]{6}$/.test(v)?v:'#f53225'}
 function sanitize(data){
  if(!data||typeof data!=='object'||!Array.isArray(data.items))throw Error('This file does not contain a valid menu.');
  const d=clone(STARTUP_CONFIG); d.buildId=String(data.buildId||Date.now());
  for(const k of ['brand','subtitle','ticker','accent','motion'])if(typeof data[k]==='string')d[k]=data[k].slice(0,k==='ticker'?350:100);
  d.accent=safeColor(d.accent); if(!['normal','low','off'].includes(d.motion))d.motion='normal';
  d.items=data.items.slice(0,24).map((it,i)=>({
   id:String(it.id||'item-'+i).replace(/[^\w-]/g,'').slice(0,55)||'item-'+i,
   number:String(it.number||i+1).slice(0,8), name:String(it.name||'New Item').slice(0,80),
   desc:String(it.desc||'').slice(0,210), price:String(it.price||'0').slice(0,15),
   tag:String(it.tag||'').slice(0,32),
   image:typeof it.image==='string'&&(it.image.startsWith('data:image/')||it.image==='')?it.image:'',
   enabled:it.enabled!==false
  }));
  return d;
 }
 function load(){try{let raw=localStorage.getItem(STORAGE_KEY);if(raw){let found=sanitize(JSON.parse(raw));if(found.buildId===STARTUP_CONFIG.buildId)current=found}}catch(e){console.warn('Local storage not available:',e)} }
 function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(current));tempSaveSucceeded=true;$('saveStatus').textContent='✓ Saved locally';}
  catch(e){tempSaveSucceeded=false;$('saveStatus').textContent='Local save unavailable';toast('Local storage full — use Publish HTML to save changes.');}
 }
 function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3800)}
 function fit(){const area=$('display');const scale=Math.min(area.clientWidth/1920,area.clientHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+Math.max(scale,.01)+')';}
 const resizeObserver=typeof ResizeObserver!=='undefined'?new ResizeObserver(fit):null;
 if(resizeObserver)resizeObserver.observe($('display'));else window.addEventListener('resize',fit);
 function formatBrand(s){return String(s||'Papi’s').toUpperCase()}
 function render(){
  document.documentElement.style.setProperty('--accent',safeColor(current.accent));
  $('brandTitle').textContent=formatBrand(current.brand);$('brandSubtitle').textContent=formatBrand(current.subtitle);
  $('footerBrand').textContent=formatBrand(current.brand);
  const news=(current.ticker||'PICK YOUR FAVORITE • TENDERS • SANDWICHES • LOADED FRIES').toUpperCase();
  $('tickerTrack').innerHTML='<span class="ticker-copy">'+esc(news)+'</span><span class="ticker-copy">'+esc(news)+'</span><span class="ticker-copy">'+esc(news)+'</span><span class="ticker-copy">'+esc(news)+'</span>';
  stage.classList.toggle('low-motion',current.motion==='low');stage.classList.toggle('no-motion',current.motion==='off');stage.classList.toggle('force-motion',current.motion!=='off');
  const active=current.items.filter(it=>it.enabled);
  const grid=$('menuGrid'); const count=active.length;
  grid.style.gridTemplateColumns='repeat('+Math.min(4,Math.max(1,count))+',minmax(0,1fr))';
  grid.style.gridTemplateRows='repeat('+Math.max(1,Math.ceil(count/4))+',minmax(0,1fr))';
  if(count>12){grid.style.gap='9px'}else grid.style.gap='17px';
  grid.innerHTML=active.map((it,i)=>{
   let length=it.name.length;let nameClass=length>20?'verylong':length>15?'long':'';
   return '<article class="dish-card" style="--ix:'+i+'" data-card-id="'+esc(it.id)+'">'
    +'<div class="card-head"><div class="card-number">#'+esc(it.number)+'</div><div class="card-title '+nameClass+'">'+esc(it.name)+'</div></div>'
    +'<div class="card-description">'+esc(it.desc)+'</div>'
    +'<div class="food-window '+(it.image?'':'no-photo')+'">'+(it.image?'<img class="food-image" src="'+esc(it.image)+'" alt="'+esc(it.name)+'">':'<span class="fallback">🍗</span>')+'</div>'
    +(it.tag?'<span class="dish-tag">'+esc(it.tag)+'</span>':'')
    +'<div class="price-sticker"><span>'+esc(price(it.price))+'</span></div>'
    +'</article>';
  }).join('');
  clearInterval(spotTimer);spotIndex=-1;
  if(current.motion!=='off' && active.length>1){
   const cards=Array.from(grid.children);
   const next=()=>{cards.forEach(e=>e.classList.remove('spotlit'));spotIndex=(spotIndex+1)%cards.length;cards[spotIndex].classList.add('spotlit')};
   next();spotTimer=setInterval(next,current.motion==='low'?18000:9000);
  }
 }
 function makeField(label,id,value,type='text',help=''){
  let control=type==='textarea'?'<textarea id="'+id+'">'+esc(value)+'</textarea>':'<input id="'+id+'" type="'+esc(type)+'" value="'+esc(value)+'"'+(type==='number'?' step="0.01" min="0"':'')+'>';
  return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+control+(help?'<small>'+esc(help)+'</small>':'')+'</div>';
 }
 function renderList(){const list=$('itemList');if(!list)return;
  list.innerHTML=current.items.map(it=>'<button class="edit-item-row '+(it.id===selectedId?'active':'')+'" data-id="'+esc(it.id)+'"><img class="edit-item-thumb" src="'+esc(it.image)+'" alt=""><span class="edit-item-text"><strong>#'+esc(it.number)+' '+esc(it.name)+'</strong><small>'+esc(price(it.price))+'</small></span>'+(it.enabled?'':'<span class="pill">HIDDEN</span>')+'</button>').join('');
  list.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectItem(b.dataset.id)));
 }
 function showItems(){
  editorContent.innerHTML='<div class="section-label">Menu items • '+current.items.length+' total</div><div id="itemList"></div>'
   +'<button class="act primary full" id="addItem" style="margin-top:9px">+ Add menu item</button><div class="edit-separator"></div>'
   +'<div id="itemForm"></div>';
  $('addItem').onclick=()=>{if(current.items.length>=24){toast('Maximum 24 items in this edition.');return}const id='item-'+Date.now();current.items.push({id,number:String(current.items.length+1),name:'New Menu Item',desc:'',price:'0.00',tag:'',image:'',enabled:true});save();render();selectItem(id)};
  if(!current.items.some(it=>it.id===selectedId))selectedId=current.items[0]?.id||null;
  renderList();showItemForm();
 }
 function selectItem(id){selectedId=id;renderList();showItemForm();}
 function showItemForm(){
  const it=current.items.find(x=>x.id===selectedId), form=$('itemForm');if(!form)return;
  if(!it){form.innerHTML='<p>No items yet. Add the first one above.</p>';return}
  form.innerHTML='<div class="section-label">Editing #'+esc(it.number)+' — '+esc(it.name)+'</div>'
   +'<div class="fieldline">'+makeField('Menu number','f-number',it.number)+makeField('Price ($)','f-price',Number(String(it.price).replace(/[^\d.]/g,''))||0,'number')+'</div>'
   +makeField('Item name','f-name',it.name)
   +makeField('Description','f-desc',it.desc,'textarea','Keep descriptions short enough to read from across the restaurant.')
   +makeField('Optional label','f-tag',it.tag,'text','Example: NEW or LIMITED; leave blank for no label.')
   +'<div class="toggle-row"><span><strong>Show on TV menu</strong><small>Hide an item without deleting it</small></span><input type="checkbox" id="f-enabled" '+(it.enabled?'checked':'')+'></div>'
   +'<div class="field"><label>Food photo</label><div class="upload-box">'+(it.image?'<img src="'+esc(it.image)+'" alt="Current food photo">':'<div style="font-size:75px;margin-bottom:10px">🍗</div>')
   +'<input id="f-image" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" aria-label="Upload food image"><small style="margin-top:9px">Photos are resized and embedded directly in the exported HTML.</small></div></div>'
   +'<div class="editor-actions"><button class="act" id="moveUp">↑ Move up</button><button class="act" id="moveDown">↓ Move down</button><button class="act danger" id="deleteItem">Delete</button></div>';
  const update=(prop,val)=>{it[prop]=val;save();render();renderList()};
  for(let prop of ['number','name','desc','price','tag'])$('f-'+prop).addEventListener('input',e=>update(prop,e.target.value));
  $('f-enabled').addEventListener('change',e=>update('enabled',e.target.checked));
  $('f-image').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('Select an image under 30 MB.');const src=await fileToDataURL(f);const image=await loadImage(src);let size=800;let canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');let scale=Math.min((size-14)/image.width,(size-14)/image.height);let w=image.width*scale,h=image.height*scale;ctx.drawImage(image,(size-w)/2,(size-h)/2,w,h);let result=canvas.toDataURL('image/webp',.87);if(!result.startsWith('data:image/webp'))result=canvas.toDataURL('image/png');it.image=result;save();render();renderList();showItemForm();toast('Photo added and resized.');}catch(err){toast('Photo upload failed: '+err.message)}});
  const idx=current.items.indexOf(it);
  $('moveUp').disabled=idx===0; $('moveDown').disabled=idx===current.items.length-1;
  $('moveUp').onclick=()=>{if(idx>0){[current.items[idx-1],current.items[idx]]=[it,current.items[idx-1]];save();render();showItems()}};
  $('moveDown').onclick=()=>{if(idx<current.items.length-1){[current.items[idx+1],current.items[idx]]=[it,current.items[idx+1]];save();render();showItems()}};
  $('deleteItem').onclick=()=>{if(!confirm('Delete "'+it.name+'" from the menu?'))return;current.items.splice(idx,1);selectedId=current.items[Math.min(idx,current.items.length-1)]?.id||null;save();render();showItems();toast('Item removed.')};
 }
 function fileToDataURL(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read the file.'));r.readAsDataURL(f)})}
 function loadImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Unsupported or damaged image.'));i.src=src})}
 function showBrand(){editorContent.innerHTML='<div class="section-label">Restaurant branding</div>'
  +makeField('Restaurant name','b-brand',current.brand,'text','Appears as the large menu heading.')
  +makeField('Subtitle','b-subtitle',current.subtitle)
  +makeField('Bottom moving message','b-ticker',current.ticker,'textarea','Use • to separate phrases. Text scrolls across the TV menu.')
  +'<div class="field"><label for="b-accent">Brand color</label><input type="color" id="b-accent" value="'+esc(safeColor(current.accent))+'" style="height:52px;cursor:pointer"></div>'
  +'<div class="note">Menu is designed for TVs in 1920 × 1080 landscape orientation. All information is kept visible as the subtle motion effects run.</div>';
  for(const field of ['brand','subtitle','ticker','accent'])$('b-'+field).addEventListener('input',e=>{current[field]=e.target.value;save();render()});
 }
 function showEffects(){editorContent.innerHTML='<div class="section-label">Screen animation</div>'
  +'<div class="field"><label for="motionInput">Animation style</label><select id="motionInput"><option value="normal">Cinematic — moving photos, light sweeps, highlights</option><option value="low">Gentle — slower animation</option><option value="off">Still — no motion</option></select><small>Gentle is useful if the TV display is particularly bright or distracting.</small></div>'
  +'<div class="note">Items stay in place so customers can read the entire menu while ordering. Fullscreen works best on the restaurant TV.</div>'
  +'<div class="editor-actions"><button class="act primary" id="goFullScreen">Enter fullscreen</button><button class="act" id="previewOnly">Close editor / Preview</button></div>';
  $('motionInput').value=current.motion;
  $('motionInput').onchange=e=>{current.motion=e.target.value;save();render()};
  $('goFullScreen').onclick=()=>fullscreen();$('previewOnly').onclick=()=>toggleEditor(false);
 }
 function showPublish(){editorContent.innerHTML='<div class="section-label">Take your menu live</div>'
  +'<div class="note"><strong>Download Updated HTML</strong> creates a new, self-contained menu with all current text, prices, photos and settings. Copy that file to a TV, USB drive or website. All food images are built in.</div>'
  +'<button class="act primary full" id="downloadHTML" style="font-size:17px;padding:16px">⬇ Download updated TV HTML</button>'
  +'<div class="edit-separator"></div><div class="section-label">Backup & transfer</div>'
  +'<div class="editor-actions"><button class="act" id="exportJSON">⬇ Save JSON backup</button><button class="act" id="importJSON">⬆ Import JSON backup</button></div>'
  +'<div class="edit-separator"></div><div class="section-label">Reset</div><button class="act danger" id="resetMenu">Restore original menu</button>'
  +'<div class="note"><strong>Important:</strong> Editing is local to this browser. The menu does not automatically sync between different TVs or computers. To publish updates elsewhere, use the Download Updated HTML button and replace the displayed file. Live remote editing needs a server/backend.</div>';
  $('downloadHTML').onclick=publishHTML;$('exportJSON').onclick=exportJSON;$('importJSON').onclick=()=>$('fileImport').click();
  $('resetMenu').onclick=()=>{if(!confirm('Restore the original 8-item menu? This replaces your current edits.'))return;current=clone(STARTUP_CONFIG);save();render();switchTab('items');toast('Original menu restored.')};
 }
 function renderEditor(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===activeTab));
  if(activeTab==='items')showItems();else if(activeTab==='brand')showBrand();else if(activeTab==='effects')showEffects();else showPublish();
 }
 function switchTab(tab){activeTab=tab;renderEditor()}
 function toggleEditor(force){let open=typeof force==='boolean'?force:!app.classList.contains('editing');app.classList.toggle('editing',open);if(open)renderEditor();requestAnimationFrame(fit)}
 function fullscreen(){const target=$('display');if(document.fullscreenElement)document.exitFullscreen?.();else target.requestFullscreen?.().catch(()=>toast('Use your browser’s F11 key for fullscreen.'))}
 function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
 function exportJSON(){downloadBlob(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}),'Papis_Menu_Backup.json');toast('Menu JSON downloaded.')}
 function publishHTML(){
  const output=clone(current);output.buildId='published-'+Date.now();
  const dom=document.documentElement.cloneNode(true);dom.querySelector('#startupData').textContent=JSON.stringify(output).replace(/</g,'\\u003c');
  dom.querySelector('#app').classList.remove('editing');dom.querySelector('#toast').classList.remove('show');dom.querySelector('#toast').textContent='';
  const data='<!doctype html>\n'+dom.outerHTML;
  downloadBlob(new Blob([data],{type:'text/html;charset=utf-8'}),'Papis_Hot_Chicken_Menu_UPDATED.html');
  toast('Updated TV HTML downloaded. Replace the previous file on the TV or website.');
 }
 $('fileImport').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const text=await f.text();current=sanitize(JSON.parse(text));current.buildId=STARTUP_CONFIG.buildId;selectedId=current.items[0]?.id||null;save();render();switchTab('items');toast('Menu backup imported.')}catch(err){toast('Import failed: '+err.message)}e.target.value=''};
 $('toggleEditor').onclick=()=>toggleEditor();$('closeEditor').onclick=()=>toggleEditor(false);$('publishShortcut').onclick=publishHTML;$('toggleFullscreen').onclick=fullscreen();
 $('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)});
 window.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='e'||e.key==='E'){toggleEditor();e.preventDefault()}if(e.key==='f'||e.key==='F'){fullscreen();e.preventDefault()}if(e.key==='Escape'&&app.classList.contains('editing'))toggleEditor(false)});
 window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){let was=current;try{let next=sanitize(JSON.parse(e.newValue));if(next.buildId===STARTUP_CONFIG.buildId){current=next;render();if(app.classList.contains('editing'))renderEditor()}}catch(err){current=was}}});
 load();render();requestAnimationFrame(fit);
 if(window.location.hash==='#edit'||new URLSearchParams(location.search).has('edit'))toggleEditor(true);
})();
</script>
</body>
</html>
